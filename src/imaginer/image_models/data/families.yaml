# Stable-Imaginer's notes on sd-server's image recipes (sdcpp_recipes.json, from
# stable-diffusion.cpp's examples/server/recipes). The recipe says which component slots a
# family needs and its generation defaults; this file says what the recipes don't:
#
#   group        how the model library groups families
#   lora_group   which LoRAs fit: LoRAs made for the same group (by their metadata or Hub
#                card) are taken as made for this family
#   prompt       how the chat model should write prompts: natural (default), tags or json
#   hint         a note for the chat model about prompting this family
#   note         a note shown on the model card (e.g. a conversion it needs first)
#   native       [width, height] to use instead of the recipe's (recipes cap them at 1024)
#   defaults     sampling defaults to use over the recipe's (our names: steps, cfg_scale,
#                sampler, scheduler, flow_shift, sigmas, guidance, clip_skip)
#   model_args   --model-args the family's sd.cpp doc recommends
#   rgba         prompt template for transparent output ({prompt}); without one the family
#                makes no RGBA images
#   mask         how an edit's mask is explained in the prompt; without one it takes none
#   edit_only    an edit model: it needs reference images, so it makes no text-to-image
#   max_refs     the most reference images it handles well (1: it edits one image); none
#                given, as many as the engine allows
#   vision       its edits need the text encoder's vision weights: with a GGUF text encoder
#                and no vision projector (llm_vision) it can't edit
#   add_slots    slots its sd.cpp doc passes that the recipe leaves out ({id, label})
#   size_multiple  what its sizes snap to, over the recipe's
#   names        regexes on a file's name that point at the family (case-insensitive)
#   repos        Hub repos (or "owner/" prefixes) that point at it
#   gguf         GGUF general.architecture values that point at it
#   sources      per slot, Hub references to get that component from, best first: a repo,
#                a folder or file in it (owner/name/path), or owner/name:QUANT
#
# Families listed under hidden are control, inpainting, decoder and community-edit recipes:
# out of the library's scope, though an engine configured by hand may still name one.

hidden:
  - anima-edit
  - cosxl-edit
  - flex2
  - flux1-canny
  - flux1-depth
  - flux1-fill
  - flux1-pulid
  - instruct-pix2pix
  - krea2-raw-edit
  - krea2-turbo-edit
  - pid
  - pid-15
  - pid-15-flux2
  - pid-15-qwen-image
  - pid-15-sd3
  - pid-flux2
  - pid-qwen-image
  - pid-sd3
  - qwen-image-layered
  - sd1-controlnet
  - sd1-inpainting
  - sd1-ip-adapter
  - sd2-inpainting
  - sdxl-controlnet
  - sdxl-inpainting
  - sdxl-ip-adapter
  - sdxl-photomaker

hints:
  tags: >-
    This model reads comma-separated tags and short phrases best: the subject first, then
    details, style, lighting and quality words. Keep it under about 75 tokens (CLIP reads no
    further), and put what to avoid in the negative prompt.
  json: >-
    This model was trained on structured JSON captions: write the prompt as one JSON object
    whose "high_level_description" field describes the whole image, with any further
    details as more fields.

families:
  # --- Stable Diffusion 1.x / 2.x / SDXL: single-file checkpoints -------------------------
  sd1-checkpoint:
    group: Stable Diffusion 1.x
    lora_group: sd1
    prompt: tags
    names: ['\bsd[-_ ]?v?1[-_.]?[45]\b', 'v1-5', 'sd15', 'dreamshaper[-_]?[0-8]\b']
    repos: [stable-diffusion-v1-5/, runwayml/, CompVis/]
    gguf: [sd1]
    sources:
      model: [stable-diffusion-v1-5/stable-diffusion-v1-5/v1-5-pruned-emaonly.safetensors]
  sd2-512-checkpoint:
    group: Stable Diffusion 2.x
    lora_group: sd2
    prompt: tags
    names: ['sd[-_]?2[-_.]?1?[-_]?base', 'v2-1_512', '512-base']
    repos: [Manojb/stable-diffusion-2-1-base]
    sources:
      model: [Manojb/stable-diffusion-2-1-base]
  sd2-768-checkpoint:
    group: Stable Diffusion 2.x
    lora_group: sd2
    prompt: tags
    names: ['v2-1_768', '768-v', 'sd[-_]?2[-_.]?1(?!.*base)']
  sd-turbo:
    group: Stable Diffusion 2.x
    lora_group: sd2
    prompt: tags
    names: ['\bsd[-_]?turbo']
    repos: [stabilityai/sd-turbo]
    sources:
      model: [stabilityai/sd-turbo]
  sdxl-checkpoint:
    group: SDXL
    lora_group: sdxl
    prompt: tags
    names: ['sd[-_]?xl(?![-_]?turbo)', 'xl[-_]base', 'ssd[-_]?1b', 'segmind[-_]?vega', 'pony',
            'illustrious', 'noob[-_]?ai', 'juggernaut[-_]?xl', 'realvis[-_]?xl']
    repos: [stabilityai/stable-diffusion-xl-base-1.0, segmind/SSD-1B, segmind/Segmind-Vega]
    gguf: [sdxl]
    sources:
      model: [stabilityai/stable-diffusion-xl-base-1.0/sd_xl_base_1.0.safetensors]
      vae: [madebyollin/sdxl-vae-fp16-fix]
  sdxl-turbo:
    group: SDXL
    lora_group: sdxl
    prompt: tags
    names: ['sd[-_]?xl[-_]?turbo']
    repos: [stabilityai/sdxl-turbo]
    sources:
      model: [stabilityai/sdxl-turbo]
  nitrosd-realism:
    group: SDXL
    lora_group: sdxl
    prompt: tags
    names: ['nitro[-_]?sd']
  sdxs:
    group: Stable Diffusion 1.x
    lora_group: sd1
    prompt: tags
    names: ['\bsdxs\b', 'sdxs[-_]']
    repos: [akleine/sdxs-512, concedo/sdxs-512-tinySDdistilled-GGUF]
    sources:
      model: [akleine/sdxs-512, concedo/sdxs-512-tinySDdistilled-GGUF]

  # --- SD3 ---------------------------------------------------------------------------------
  sd3-medium:
    group: Stable Diffusion 3
    lora_group: sd3
    names: ['sd3[-_.]?medium', 'sd3_medium']
    repos: [stabilityai/stable-diffusion-3-medium]
    gguf: [sd3]
    sources:
      model: [stabilityai/stable-diffusion-3-medium]
  sd35-large:
    group: Stable Diffusion 3
    lora_group: sd35-large
    names: ['sd3[-_.]?5[-_.]?large']
    repos: [stabilityai/stable-diffusion-3.5-large]
    gguf: [sd3]
    sources:
      model: [Comfy-Org/stable-diffusion-3.5-fp8/sd3.5_large_fp8_scaled.safetensors,
              stabilityai/stable-diffusion-3.5-large]
      clip_l: [Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/clip_l.safetensors]
      clip_g: [Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/clip_g.safetensors]
      t5xxl: [Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/t5xxl_fp16.safetensors,
              Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/t5xxl_fp8_e4m3fn.safetensors]
  sd35-medium:
    group: Stable Diffusion 3
    lora_group: sd35-medium
    names: ['sd3[-_.]?5[-_.]?medium']
    repos: [stabilityai/stable-diffusion-3.5-medium]
    gguf: [sd3]
    sources:
      model: [stabilityai/stable-diffusion-3.5-medium]
      clip_l: [Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/clip_l.safetensors]
      clip_g: [Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/clip_g.safetensors]
      t5xxl: [Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/t5xxl_fp16.safetensors,
              Comfy-Org/stable-diffusion-3.5-fp8/text_encoders/t5xxl_fp8_e4m3fn.safetensors]

  # --- FLUX ----------------------------------------------------------------------------------
  flux1-dev:
    group: FLUX.1
    lora_group: flux1
    names: ['flux[-_.]?1?[-_.]?dev', 'flux[-_.]?1[-_.]?lite']
    repos: [black-forest-labs/FLUX.1-dev, leejet/FLUX.1-dev-gguf, city96/FLUX.1-dev-gguf]
    gguf: [flux]
    sources:
      diffusion_model: [leejet/FLUX.1-dev-gguf, black-forest-labs/FLUX.1-dev/flux1-dev.safetensors]
      clip_l: [comfyanonymous/flux_text_encoders/clip_l.safetensors]
      t5xxl: [comfyanonymous/flux_text_encoders/t5xxl_fp16.safetensors,
              comfyanonymous/flux_text_encoders/t5xxl_fp8_e4m3fn.safetensors]
      vae: [black-forest-labs/FLUX.1-schnell/ae.safetensors,
            Comfy-Org/z_image_turbo/split_files/vae/ae.safetensors]
  flux1-schnell:
    group: FLUX.1
    lora_group: flux1
    names: ['flux[-_.]?1?[-_.]?schnell', '\bschnell\b']
    repos: [black-forest-labs/FLUX.1-schnell, leejet/FLUX.1-schnell-gguf]
    gguf: [flux]
    sources:
      diffusion_model: [leejet/FLUX.1-schnell-gguf,
                        black-forest-labs/FLUX.1-schnell/flux1-schnell.safetensors]
      clip_l: [comfyanonymous/flux_text_encoders/clip_l.safetensors]
      t5xxl: [comfyanonymous/flux_text_encoders/t5xxl_fp16.safetensors,
              comfyanonymous/flux_text_encoders/t5xxl_fp8_e4m3fn.safetensors]
      vae: [black-forest-labs/FLUX.1-schnell/ae.safetensors,
            Comfy-Org/z_image_turbo/split_files/vae/ae.safetensors]
  flux1-kontext:
    group: FLUX.1
    lora_group: flux1-kontext
    names: ['kontext']
    repos: [black-forest-labs/FLUX.1-Kontext-dev, QuantStack/FLUX.1-Kontext-dev-GGUF]
    gguf: [flux]
    max_refs: 1
    hint: >-
      To edit, write one instruction ("make the car red", "change the sign to say 'OPEN'") and
      say what must stay the same ("keep the face, pose and framing"). It edits one image.
    sources:
      diffusion_model: [QuantStack/FLUX.1-Kontext-dev-GGUF,
                        black-forest-labs/FLUX.1-Kontext-dev/flux1-kontext-dev.safetensors]
      clip_l: [comfyanonymous/flux_text_encoders/clip_l.safetensors]
      t5xxl: [comfyanonymous/flux_text_encoders/t5xxl_fp16.safetensors,
              comfyanonymous/flux_text_encoders/t5xxl_fp8_e4m3fn.safetensors]
      vae: [black-forest-labs/FLUX.1-schnell/ae.safetensors,
            Comfy-Org/z_image_turbo/split_files/vae/ae.safetensors]
  flux2-dev:
    group: FLUX.2
    lora_group: flux2-dev
    names: ['flux[-_.]?2[-_.]?dev']
    repos: [black-forest-labs/FLUX.2-dev, city96/FLUX.2-dev-gguf]
    sources:
      diffusion_model: [city96/FLUX.2-dev-gguf]
      llm: ['unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF:Q4_K_M']
      vae: [Comfy-Org/flux2-klein-4B/split_files/vae/flux2-vae.safetensors]
  flux2-klein-4b:
    group: FLUX.2
    lora_group: flux2-klein-4b
    names: ['flux[-_.]?2[-_.]?klein[-_.]?4b(?!.*base)']
    repos: [black-forest-labs/FLUX.2-klein-4B, leejet/FLUX.2-klein-4B-GGUF]
    sources:
      diffusion_model: [leejet/FLUX.2-klein-4B-GGUF,
                        Comfy-Org/flux2-klein-4B/split_files/diffusion_models/flux-2-klein-4b.safetensors]
      llm: [Comfy-Org/flux2-klein-4B/split_files/text_encoders/qwen_3_4b.safetensors,
            'unsloth/Qwen3-4B-GGUF:Q4_K_M']
      vae: [Comfy-Org/flux2-klein-4B/split_files/vae/flux2-vae.safetensors]
  flux2-klein-base-4b:
    group: FLUX.2
    lora_group: flux2-klein-4b
    names: ['flux[-_.]?2[-_.]?klein[-_.]?base[-_.]?4b', 'flux[-_.]?2[-_.]?klein[-_.]?4b.*base']
    repos: [black-forest-labs/FLUX.2-klein-base-4B, leejet/FLUX.2-klein-base-4B-GGUF]
    sources:
      diffusion_model: [leejet/FLUX.2-klein-base-4B-GGUF,
                        Comfy-Org/flux2-klein-4B/split_files/diffusion_models/flux-2-klein-base-4b.safetensors]
      llm: [Comfy-Org/flux2-klein-4B/split_files/text_encoders/qwen_3_4b.safetensors,
            'unsloth/Qwen3-4B-GGUF:Q4_K_M']
      vae: [Comfy-Org/flux2-klein-4B/split_files/vae/flux2-vae.safetensors]
  flux2-klein-9b:
    group: FLUX.2
    lora_group: flux2-klein-9b
    names: ['flux[-_.]?2[-_.]?klein[-_.]?9b(?!.*base)']
    repos: [black-forest-labs/FLUX.2-klein-9B, leejet/FLUX.2-klein-9B-GGUF]
    sources:
      diffusion_model: [leejet/FLUX.2-klein-9B-GGUF]
      llm: [Comfy-Org/flux2-klein-9B, 'unsloth/Qwen3-8B-GGUF:Q4_K_M']
      vae: [Comfy-Org/flux2-klein-4B/split_files/vae/flux2-vae.safetensors]
  flux2-klein-base-9b:
    group: FLUX.2
    lora_group: flux2-klein-9b
    names: ['flux[-_.]?2[-_.]?klein[-_.]?base[-_.]?9b', 'flux[-_.]?2[-_.]?klein[-_.]?9b.*base']
    repos: [black-forest-labs/FLUX.2-klein-base-9B, leejet/FLUX.2-klein-base-9B-GGUF]
    sources:
      diffusion_model: [leejet/FLUX.2-klein-base-9B-GGUF]
      llm: [Comfy-Org/flux2-klein-9B, 'unsloth/Qwen3-8B-GGUF:Q4_K_M']
      vae: [Comfy-Org/flux2-klein-4B/split_files/vae/flux2-vae.safetensors]
