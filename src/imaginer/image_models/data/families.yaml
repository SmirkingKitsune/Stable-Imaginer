    gguf: [qwen_image]
    rgba: 'This is an RGBA image with transparency. {prompt}. The image has alpha channel and the background is transparent.'
    mask: 'The last image is a mask: change only the area that is white in the mask and keep everything else exactly as it is.'
    sources:
      diffusion_model: [Comfy-Org/Qwen-Image-2.1/diffusion_models/qwen_image_2.1_turbo_bf16.safetensors,
                        Comfy-Org/Qwen-Image-2.1/diffusion_models/qwen_image_2.1_turbo_int8_convrot.safetensors]
      llm: [Comfy-Org/Qwen-Image-2.1/text_encoders/qwen3vl_8b_bf16.safetensors,
            'Qwen/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M']
      llm_vision: [Qwen/Qwen3-VL-8B-Instruct-GGUF/mmproj-Qwen3VL-8B-Instruct-F16.gguf]
      vae: [Comfy-Org/Qwen-Image-2.1/vae/qwen_image_2.1_vae_bf16.safetensors]

  qwen-image-edit:
    group: Qwen Image
    lora_group: qwen-image-edit
    names: ['qwen[-_]?image[-_]?edit(?![-_]?(25\d\d|plus))']
    repos: [Qwen/Qwen-Image-Edit, QuantStack/Qwen-Image-Edit-GGUF,
