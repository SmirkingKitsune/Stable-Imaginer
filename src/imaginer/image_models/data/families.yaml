    lora_group: qwen-image
    names: ['qwen[-_]?image(?![-_.]?(2[._]?1|edit|layered))']
    repos: [Qwen/Qwen-Image, QuantStack/Qwen-Image-GGUF, Comfy-Org/Qwen-Image_ComfyUI]
