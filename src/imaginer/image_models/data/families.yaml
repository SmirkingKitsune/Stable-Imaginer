      diffusion_model: [Comfy-Org/Qwen-Image-2.1/diffusion_models/qwen_image_2.1_bf16.safetensors,
                        Comfy-Org/Qwen-Image-2.1/diffusion_models/qwen_image_2.1_int8_convrot.safetensors,
                        leejet/Qwen-Image-2.1-GGUF]
