  # --- Chroma ------------------------------------------------------------------------------
  chroma:
    group: Chroma
    lora_group: chroma
    names: ['chroma(?![-_]?1?[-_]?radiance)']
    repos: [lodestones/Chroma, lodestones/Chroma1-HD, silveroxides/Chroma-GGUF]
