    sources:
      diffusion_model: [Comfy-Org/Qwen-Image_ComfyUI/split_files/diffusion_models,
                        QuantStack/Qwen-Image-GGUF]
      llm: [Comfy-Org/Qwen-Image_ComfyUI/split_files/text_encoders/qwen_2.5_vl_7b.safetensors,
            'mradermacher/Qwen2.5-VL-7B-Instruct-GGUF:Q4_K_M']
      vae: [Comfy-Org/Qwen-Image_ComfyUI/split_files/vae/qwen_image_vae.safetensors]
  qwen-image-21:
    group: Qwen Image
    lora_group: qwen-image-21
    native: [2048, 2048]
    names: ['qwen[-_]?image[-_.]?2[._]?1(?!.*turbo)']
    repos: [Qwen/Qwen-Image-2.1, Comfy-Org/Qwen-Image-2.1, leejet/Qwen-Image-2.1-GGUF,
            unsloth/Qwen-Image-2.1-FP8]
    gguf: [qwen_image]
    rgba: 'This is an RGBA image with transparency. {prompt}. The image has alpha channel and the background is transparent.'
    mask: 'The last image is a mask: change only the area that is white in the mask and keep everything else exactly as it is.'
