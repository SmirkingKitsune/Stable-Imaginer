# Developer convenience for `uv run alembic revision --autogenerate -m "..."`.
# The app migrates itself on startup (db.auto_migrate) or via `imaginer db upgrade`.
# The database URL comes from the active profile ($IMAGINER_PROFILE, default "dev").

[alembic]
script_location = %(here)s/src/imaginer/db/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
