name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows x64 (desktop), Linux x64 (NAS), Linux arm64 (DGX Spark class hosts).
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (without the optional [diffusers] extra)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type-check
        run: uv run mypy

      - name: Migrations match models
        run: |
          uv run imaginer db upgrade --profile dev
          uv run imaginer db check --profile dev
        env:
          IMAGINER_DATA_ROOT: ${{ runner.temp }}/imaginer-ci

      - name: Tests
        run: uv run pytest

  package:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      # Install the wheel alone in a fresh venv: proves migrations and config loading ship
      # in the package, independent of the source checkout.
      - name: Install the wheel in a clean venv
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv" dist/*.whl

      - name: Smoke-test the installed package
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          IMAGINER_DATA_ROOT: ${{ runner.temp }}/imaginer-wheel
        run: |
          PY="$RUNNER_TEMP/wheel-venv/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          printf 'backends: {}\n' > smoke.yaml
          "$PY" -m imaginer db upgrade --profile smoke.yaml
          "$PY" -m imaginer db check --profile smoke.yaml
          "$PY" -c "import imaginer.backends.diffusers_inproc, imaginer.main; print('imports ok')"
