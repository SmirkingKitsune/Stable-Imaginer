[project]
name = "stable-imaginer"
version = "0.1.0"
description = "Local multimodal conversation server: a chat LLM driving image generation and editing through swappable engine adapters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Stable-Imaginer contributors" }]
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11.0",
    "platformdirs>=4.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "sqlalchemy[asyncio]>=2.1",
    "sse-starlette>=2.2",
    "structlog>=24.4",
    "uvicorn[standard]>=0.34",
    "zeroconf>=0.136",
]

[project.optional-dependencies]
# In-process Qwen-Image-2.1 reference backend. On Windows and Linux, torch comes from the
# PyTorch CUDA 13.0 index below (Blackwell sm_120 needs CUDA >= 12.8; PyPI's Windows torch
# is CPU-only).
diffusers = [
    "accelerate>=1.0",
    "diffusers>=0.42.1",
    "torch>=2.7",
    "transformers>=5.17",
]
postgres = ["asyncpg>=0.30"]

[project.scripts]
imaginer = "imaginer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imaginer"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "PIE",
    "RUF",
    "ASYNC",         # blocking calls inside async code
    "PTH",           # pathlib everywhere (cross-platform rule from the brief)
    "T20",           # no stray print()
]

[tool.ruff.lint.per-file-ignores]
"src/imaginer/cli.py" = ["T20"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src/imaginer", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests stay typed but don't need to annotate every fixture parameter.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# Optional heavy dependencies ([diffusers] extra), imported lazily by one adapter.
module = ["torch", "torch.*", "diffusers", "diffusers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: talks to real engines (llama-server / sd-server); opt in with -m integration",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::sqlalchemy.exc.SADeprecationWarning",
]
